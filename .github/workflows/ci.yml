# frontend 仓库 CI
#
# 本仓库自成体系：类型检查、lint、构建都不依赖其他仓库。
# 需要真实后端的端到端冒烟（e2e/smoke.mjs）**不在这里跑**——
# 它要 MySQL + Spring Boot 一起起来，属于跨仓库的集成验证，
# 放在这里等于把 framework 的构建产物也扛进前端 CI。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 与 package.json engines 保持一致，不要写 'lts/*'
          node-version: 22.18.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 用仓库自带的命令，而不是自己拼一条 eslint 命令：
      #   pnpm lint  = oxfmt --check + oxlint + eslint + stylelint
      #   pnpm check = 循环依赖 + 依赖检查 + turbo typecheck + cspell
      # lefthook 的 pre-commit 钩子跑的是 pnpm lint + pnpm check:type，这里是它的超集。
      # 只跑其中一条的话，本地能提交的代码到 CI 才挂，或者反过来 CI 绿着、lint 从没跑过。
      #
      # 其中 eslint 的 no-restricted-imports 承担 @core 的分层约束，
      # 该规则在合并 scope 后需要否定模式才正确，必须真的跑到。
      - name: 格式与 lint
        run: pnpm lint

      - name: 检查（类型 / 循环依赖 / 依赖 / 拼写）
        run: pnpm check

      - name: 构建
        run: pnpm -F @describeadmin/admin run build

      - name: 校验产物中没有残留的上游 CDN 外链
        # 目标部署环境（政务内网）通常无公网出口，外链资源会一直加载失败，
        # 且表现为「图一直转圈」，排查时容易被误判成样式问题
        run: |
          if grep -rq "unpkg.com\|@vbenjs/static-source" apps/admin/dist; then
            echo "::error::构建产物中仍存在外部 CDN 引用"
            grep -ro "https://[^\"']*unpkg[^\"']*" apps/admin/dist | head -5
            exit 1
          fi
          echo "OK：无外部 CDN 引用"
