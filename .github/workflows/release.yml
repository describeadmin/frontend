# frontend 发布：@describeadmin/* 到 npm
#
# 需要在 GitHub 组织/仓库 Secrets 中配置：
#   NPM_TOKEN   npm Access Token，类型必须是 Automation
#               （Publish 类型带 2FA 交互，会让 CI 卡死）
#
# 触发：打 tag v* 自动发布；或手动触发（默认 dry-run，只打包校验不上传）。
#
# 【与 Maven Central 的区别】
# npm 允许在 72 小时内 unpublish，因此这条链路不像 Central 那样完全不可逆。
# 但一旦有人装过，unpublish 就会破坏对方的构建，实际上仍应当作不可逆对待。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包与校验，不上传到 npm'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 tag 与全部待发布包的版本一致
        # 抽查单个包是不够的：只要有一个包漏了版本号，发出去的就是
        # 版本不齐的一组包，而互相之间又用 ^ range 依赖，消费者会装到混合版本。
        # 这里断言【每一个】待发布包都等于 tag。
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag="${GITHUB_REF#refs/tags/v}"
          echo "tag=$tag"
          node -e '
            const {execSync} = require("child_process");
            const fs = require("fs"), path = require("path");
            const tag = process.argv[1];
            const list = JSON.parse(execSync("pnpm ls -r --depth -1 --json", {encoding:"utf8"}));
            let bad = 0, n = 0;
            for (const p of list) {
              const f = path.join(p.path, "package.json");
              if (!fs.existsSync(f)) continue;
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              if (pkg.private || !pkg.name?.startsWith("@describeadmin/")) continue;
              n++;
              if (pkg.version !== tag) {
                console.error(`::error::${pkg.name} 版本为 ${pkg.version}，与 tag v${tag} 不一致`);
                bad = 1;
              }
            }
            if (n === 0) { console.error("::error::没有找到任何待发布包"); process.exit(1); }
            console.log(`  ✓ ${n} 个待发布包的版本均为 ${tag}`);
            process.exit(bad);
          ' "$tag"

      - name: 构建全部包
        run: pnpm build

      - name: publint
        # ⚠️ vsh publint 按 package.json 内容哈希缓存结果，
        # 缓存命中时报的是【上一次】的结论，与当前 dist 无关。
        # 不清缓存的话，dist 被删光也可能报「无问题」——这个门禁是反的。
        run: |
          rm -rf node_modules/.cache/publint
          pnpm publint

      - name: 校验每个待发布包的 dist 真的有内容
        # publint 检查的是 package.json 的正确性，不保证 dist 非空。
        # 二者缺一不可：exports 写得再对，dist 是空的，业务方装上去照样白屏。
        run: |
          set -e
          node -e '
            const {execSync} = require("child_process");
            const fs = require("fs"), path = require("path");
            const list = JSON.parse(execSync("pnpm ls -r --depth -1 --json", {encoding:"utf8"}));
            let fail = 0, checked = 0;
            for (const p of list) {
              const pkgPath = path.join(p.path, "package.json");
              if (!fs.existsSync(pkgPath)) continue;
              const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
              if (pkg.private || !pkg.name?.startsWith("@describeadmin/")) continue;
              checked++;
              const dist = path.join(p.path, "dist");
              if (!fs.existsSync(dist)) { console.error(`::error::${pkg.name} 没有 dist 目录`); fail = 1; continue; }
              const bytes = fs.readdirSync(dist, {recursive:true})
                .map(f => path.join(dist, f))
                .filter(f => fs.statSync(f).isFile())
                .reduce((s, f) => s + fs.statSync(f).size, 0);
              if (bytes === 0) { console.error(`::error::${pkg.name} 的 dist 总字节数为 0`); fail = 1; continue; }
              console.log(`  ✓ ${pkg.name.padEnd(40)} ${bytes} bytes`);
            }
            console.log(`共校验 ${checked} 个待发布包`);
            if (checked === 0) { console.error("::error::没有找到任何待发布包，配置有误"); process.exit(1); }
            process.exit(fail);
          '

      - name: 校验发布目标是 npmjs.org 而不是镜像源
        # 仓库根目录的 .npmrc 把 registry 指向 registry.npmmirror.com——
        # 装包时这是对的（国内快），但那是【只读镜像】，NPM_TOKEN 对它无效，
        # publish 会得到 401 Login first。而 401 看起来像「token 配错了」，
        # 会把人引到完全错误的方向上去查。
        #
        # 下面所有 publish 都显式带 --registry，这一步则是守卫：
        # 万一将来有人改了配置，让它在【发布之前】就喊出来。
        run: |
          set -e
          echo "仓库 .npmrc: $(cat .npmrc 2>/dev/null || echo '(无)')"
          target="${PUBLISH_REGISTRY}"
          case "$target" in
            https://registry.npmjs.org/) echo "  ✓ 发布目标 $target" ;;
            *) echo "::error::发布目标是 $target，不是 npmjs.org"; exit 1 ;;
          esac
        env:
          PUBLISH_REGISTRY: 'https://registry.npmjs.org/'

      - name: 诊断：确认令牌真的通过了认证
        # 把「是不是 token 没读到」这个问题一次性钉死。
        # 0.1.0 首发时出现过 429，错误文案是
        #   "Could not publish, as user undefined: rate limited exceeded"
        # 那句 "as user undefined" 极易让人以为是认证失败，从而反复
        # 重置令牌——而真实原因是 npm 对【创建新包】的配额。
        # whoami 能打印出用户名，就说明认证没问题，可以直接排除这条线索。
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -e
          who=$(npm whoami --registry https://registry.npmjs.org/ 2>&1) || {
            echo "::error::令牌未通过认证：$who"; exit 1; }
          echo "  ✓ 已认证为 $who"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 打包演练（不上传）
        run: pnpm publish -r --dry-run --no-git-checks --access public --registry https://registry.npmjs.org/

      - name: 发布到 npm（带限流退避重试）
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        # --registry 是命令行参数，优先级高于仓库 .npmrc 里的 registry=。
        # 带尾斜杠是为了和 setup-node 写入的鉴权键
        # //registry.npmjs.org/:_authToken 精确匹配。
        #
        # 【为什么必须有重试】
        # 本仓库一次要发 27 个包。npm 对【新建包】有发布速率限制，
        # 0.1.0 首发时实际撞上了：25 个发出去之后第 26 个拿到
        #   429 Too Many Requests ... rate limited exceeded
        # 结果是【半发布】——一部分包在 registry 上，一部分不在。
        #
        # 那次运气好，卡在两个叶子包上（layouts / plugins），没有其他
        # 已发布包依赖它们，所以已发出的 25 个内部仍然自洽。但如果卡在
        # core-shared 这种被大量依赖的包上，整组包会真的破损：
        # 消费者装得到 A，却拉不到 A 依赖的 B。
        #
        # 对一个要发几十个新包的仓库，撞限流是必然而不是意外。
        #
        # 【为什么重试是安全的】
        # pnpm publish 会跳过 registry 上【已存在的相同版本】，
        # 因此重跑只会补发缺的那些，不会重复发布、也不会覆盖。
        # 这个幂等性正是这段循环成立的前提——没有它，重试就是危险动作。
        run: |
          set -e
          # 注意每次尝试自身就要耗时约 70 秒：npm 客户端有内置的
          # fetch-retry（默认 retries=2、mintimeout=10s、maxtimeout=60s），
          # 拿到 429 后会自己先重试两次才把错误抛出来。
          # 也就是说日志里那个「恒定 71 秒」是客户端重试，不是超时——
          # 429 其实是第一时间就返回的。
          #
          # 实测：npm 对【创建新包】的配额是【小时级】的，
          # 首发 25 个包之后，第 26 个连续一小时被拒。
          # 因此这里的分钟级退避只能救「短暂抖动」，救不了配额耗尽。
          # 配额耗尽时正确的做法是隔几小时再从 main 用
          # workflow_dispatch（dry_run=false）补跑——发布是幂等的。
          delay=60
          for i in 1 2 3 4 5; do
            if pnpm publish -r --no-git-checks --access public --registry https://registry.npmjs.org/; then
              echo "  ✓ 发布完成（第 $i 次尝试）"
              exit 0
            fi
            if [ "$i" -lt 5 ]; then
              echo "::warning::第 $i 次未全部发完（多半是 429 限流），${delay}s 后重试仅补发缺失的包"
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::5 次尝试后仍未发完。请查看上方日志确认是限流还是别的原因，"
          echo "::error::并用「核实包真的到了 npmjs.org 上」的做法逐个核对缺了哪些。"
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'false'

      - name: 核实包真的到了 npmjs.org 上
        # 发布步骤 exit 0 不等于包能被别人装到。这里从 registry 反查一次。
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -e
          # 版本号从包里读，不写死——写死的常量迟早和现实脱节
          ver=$(node -e '
            const {execSync}=require("child_process"), fs=require("fs"), path=require("path");
            for (const p of JSON.parse(execSync("pnpm ls -r --depth -1 --json",{encoding:"utf8"}))) {
              const f=path.join(p.path,"package.json");
              if(!fs.existsSync(f)) continue;
              const k=JSON.parse(fs.readFileSync(f,"utf8"));
              if(k.private||!k.name?.startsWith("@describeadmin/")) continue;
              console.log(k.version); break;
            }')
          echo "核实版本 $ver"
          [ -n "$ver" ] || { echo "::error::读不到版本号"; exit 1; }
          # 逐个核对【全部】待发布包，不抽查——
          # 0.1.0 首发时的半发布状态恰恰是「大部分包在、少数不在」，
          # 抽查 4 个很可能全部命中已发布的那批，从而漏报。
          node -e '
            const {execSync}=require("child_process"), fs=require("fs"), path=require("path");
            for (const p of JSON.parse(execSync("pnpm ls -r --depth -1 --json",{encoding:"utf8"}))) {
              const f=path.join(p.path,"package.json");
              if(!fs.existsSync(f)) continue;
              const k=JSON.parse(fs.readFileSync(f,"utf8"));
              if(k.private||!k.name?.startsWith("@describeadmin/")) continue;
              console.log(k.name);
            }
          ' > /tmp/expected.txt
          echo "待核对 $(wc -l < /tmp/expected.txt) 个包"
          fail=0; n=0
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            n=$((n+1))
            got=$(npm view "$pkg@$ver" version --registry https://registry.npmjs.org/ 2>/dev/null || echo "")
            if [ -z "$got" ]; then echo "::error::$pkg@$ver 在 npmjs.org 上查不到"; fail=1; fi
          done < /tmp/expected.txt
          if [ "$fail" -eq 0 ]; then
            echo "  ✓ $n 个包在 npmjs.org 上全部可查到"
          fi
          exit "$fail"
