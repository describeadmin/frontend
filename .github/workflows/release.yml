# frontend 发布：@describeadmin/* 到 npm
#
# 需要在 GitHub 组织/仓库 Secrets 中配置：
#   NPM_TOKEN   npm Access Token，类型必须是 Automation
#               （Publish 类型带 2FA 交互，会让 CI 卡死）
#
# 触发：打 tag v* 自动发布；或手动触发（默认 dry-run，只打包校验不上传）。
#
# 【与 Maven Central 的区别】
# npm 允许在 72 小时内 unpublish，因此这条链路不像 Central 那样完全不可逆。
# 但一旦有人装过，unpublish 就会破坏对方的构建，实际上仍应当作不可逆对待。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包与校验，不上传到 npm'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 tag 与全部待发布包的版本一致
        # 抽查单个包是不够的：只要有一个包漏了版本号，发出去的就是
        # 版本不齐的一组包，而互相之间又用 ^ range 依赖，消费者会装到混合版本。
        # 这里断言【每一个】待发布包都等于 tag。
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag="${GITHUB_REF#refs/tags/v}"
          echo "tag=$tag"
          node -e '
            const {execSync} = require("child_process");
            const fs = require("fs"), path = require("path");
            const tag = process.argv[1];
            const list = JSON.parse(execSync("pnpm ls -r --depth -1 --json", {encoding:"utf8"}));
            let bad = 0, n = 0;
            for (const p of list) {
              const f = path.join(p.path, "package.json");
              if (!fs.existsSync(f)) continue;
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              if (pkg.private || !pkg.name?.startsWith("@describeadmin/")) continue;
              n++;
              if (pkg.version !== tag) {
                console.error(`::error::${pkg.name} 版本为 ${pkg.version}，与 tag v${tag} 不一致`);
                bad = 1;
              }
            }
            if (n === 0) { console.error("::error::没有找到任何待发布包"); process.exit(1); }
            console.log(`  ✓ ${n} 个待发布包的版本均为 ${tag}`);
            process.exit(bad);
          ' "$tag"

      - name: 构建全部包
        run: pnpm build

      - name: publint
        # ⚠️ vsh publint 按 package.json 内容哈希缓存结果，
        # 缓存命中时报的是【上一次】的结论，与当前 dist 无关。
        # 不清缓存的话，dist 被删光也可能报「无问题」——这个门禁是反的。
        run: |
          rm -rf node_modules/.cache/publint
          pnpm publint

      - name: 校验每个待发布包的 dist 真的有内容
        # publint 检查的是 package.json 的正确性，不保证 dist 非空。
        # 二者缺一不可：exports 写得再对，dist 是空的，业务方装上去照样白屏。
        run: |
          set -e
          node -e '
            const {execSync} = require("child_process");
            const fs = require("fs"), path = require("path");
            const list = JSON.parse(execSync("pnpm ls -r --depth -1 --json", {encoding:"utf8"}));
            let fail = 0, checked = 0;
            for (const p of list) {
              const pkgPath = path.join(p.path, "package.json");
              if (!fs.existsSync(pkgPath)) continue;
              const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
              if (pkg.private || !pkg.name?.startsWith("@describeadmin/")) continue;
              checked++;
              const dist = path.join(p.path, "dist");
              if (!fs.existsSync(dist)) { console.error(`::error::${pkg.name} 没有 dist 目录`); fail = 1; continue; }
              const bytes = fs.readdirSync(dist, {recursive:true})
                .map(f => path.join(dist, f))
                .filter(f => fs.statSync(f).isFile())
                .reduce((s, f) => s + fs.statSync(f).size, 0);
              if (bytes === 0) { console.error(`::error::${pkg.name} 的 dist 总字节数为 0`); fail = 1; continue; }
              console.log(`  ✓ ${pkg.name.padEnd(40)} ${bytes} bytes`);
            }
            console.log(`共校验 ${checked} 个待发布包`);
            if (checked === 0) { console.error("::error::没有找到任何待发布包，配置有误"); process.exit(1); }
            process.exit(fail);
          '

      - name: 校验发布目标是 npmjs.org 而不是镜像源
        # 仓库根目录的 .npmrc 把 registry 指向 registry.npmmirror.com——
        # 装包时这是对的（国内快），但那是【只读镜像】，NPM_TOKEN 对它无效，
        # publish 会得到 401 Login first。而 401 看起来像「token 配错了」，
        # 会把人引到完全错误的方向上去查。
        #
        # 下面所有 publish 都显式带 --registry，这一步则是守卫：
        # 万一将来有人改了配置，让它在【发布之前】就喊出来。
        run: |
          set -e
          echo "仓库 .npmrc: $(cat .npmrc 2>/dev/null || echo '(无)')"
          target="${PUBLISH_REGISTRY}"
          case "$target" in
            https://registry.npmjs.org/) echo "  ✓ 发布目标 $target" ;;
            *) echo "::error::发布目标是 $target，不是 npmjs.org"; exit 1 ;;
          esac
        env:
          PUBLISH_REGISTRY: 'https://registry.npmjs.org/'

      - name: 打包演练（不上传）
        run: pnpm publish -r --dry-run --no-git-checks --access public --registry https://registry.npmjs.org/

      - name: 发布到 npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        # --registry 是命令行参数，优先级高于仓库 .npmrc 里的 registry=。
        # 带尾斜杠是为了和 setup-node 写入的鉴权键
        # //registry.npmjs.org/:_authToken 精确匹配。
        run: pnpm publish -r --no-git-checks --access public --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'false'

      - name: 核实包真的到了 npmjs.org 上
        # 发布步骤 exit 0 不等于包能被别人装到。这里从 registry 反查一次。
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -e
          # 版本号从包里读，不写死——写死的常量迟早和现实脱节
          ver=$(node -e '
            const {execSync}=require("child_process"), fs=require("fs"), path=require("path");
            for (const p of JSON.parse(execSync("pnpm ls -r --depth -1 --json",{encoding:"utf8"}))) {
              const f=path.join(p.path,"package.json");
              if(!fs.existsSync(f)) continue;
              const k=JSON.parse(fs.readFileSync(f,"utf8"));
              if(k.private||!k.name?.startsWith("@describeadmin/")) continue;
              console.log(k.version); break;
            }')
          echo "核实版本 $ver"
          [ -n "$ver" ] || { echo "::error::读不到版本号"; exit 1; }
          fail=0
          for pkg in @describeadmin/ui @describeadmin/ele-ui @describeadmin/core-design @describeadmin/request; do
            got=$(npm view "$pkg@$ver" version --registry https://registry.npmjs.org/ 2>/dev/null || echo "")
            if [ -z "$got" ]; then echo "::error::$pkg@$ver 在 npmjs.org 上查不到"; fail=1
            else echo "  ✓ $pkg@$got"; fi
          done
          exit $fail
