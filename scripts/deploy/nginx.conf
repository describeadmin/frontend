
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
  worker_connections 1024;
}


http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
  }

  sendfile on;
  # tcp_nopush     on;

  #keepalive_timeout  0;
  # keepalive_timeout 65;

  # gzip on;
  # gzip_buffers 32 16k;
  # gzip_comp_level 6;
  # gzip_min_length 1k;
  # gzip_static on;
  # gzip_types text/plain
  #   text/css
  #   application/javascript
  #   application/json
  #   application/x-javascript
  #   text/xml
  #   application/xml
  #   application/xml+rss
  #   text/javascript; #设置压缩的文件类型
  # gzip_vary on;

  server {
    listen 8080;
    server_name localhost;

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;

      # 安全响应头。管理后台的静态资源只给同源页面用，不需要 CORS（原来的
      # Access-Control-Allow-Origin: * 已去掉）。
      # ⚠️ 必须写在 location 里：nginx 的 add_header 只要子块出现一条，就不再继承父块的全部 add_header。
      # 禁止被别的站点用 iframe 嵌入（点击劫持）；CSP 只声明 frame-ancestors，不限制脚本来源
      add_header X-Frame-Options "DENY" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "same-origin" always;
      # HSTS 默认不开：政务内网常见 http://10.x.x.x 部署，开了会让浏览器在一段时间内拒绝以 http 访问。
      # 确认全站只走 HTTPS 后再打开：
      # add_header Strict-Transport-Security "max-age=31536000" always;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
  }
}
